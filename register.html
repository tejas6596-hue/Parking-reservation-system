<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - ParkEasy</title>

    <link rel="icon" type="image/png" href="icons8-parking-50.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>

</head>

<body class="min-h-screen flex items-center justify-center text-white p-5">

    <div class="grid md:grid-cols-2 w-full max-w-6xl rounded-3xl overflow-hidden shadow-2xl">

        <!-- Left Section -->
        <div class="hidden md:flex flex-col justify-center p-12 bg-gradient-to-br from-cyan-600 to-blue-900">

            <h1 class="text-5xl font-bold mb-6">
                Join ParkEasy
            </h1>

            <p class="text-lg">
                Create your account and enjoy seamless parking reservations,
                real-time slot availability and smart booking management.
            </p>

            <!-- Add Image Here -->
            <img src="park2.jpg" alt="no image" class="mt-10 rounded-2xl">

        </div>

        <!-- Right Section -->
        <div class="glass p-10">

            <div class="text-center mb-8">

                <h2 class="text-4xl font-bold">
                    Create Account
                </h2>

                <p class="text-gray-300 mt-3">
                    Register to start using ParkEasy
                </p>

            </div>

            <form class="space-y-5">

                <div>
                    <label class="block mb-2">Full Name</label>

                    <input type="text"
                        placeholder="Enter your full name"
                        class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 focus:border-cyan-400 focus:outline-none">
                </div>

                <div>
                    <label class="block mb-2">Email Address</label>

                    <input type="email"
                        placeholder="Enter your email"
                        class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 focus:border-cyan-400 focus:outline-none">
                </div>

                <div>
                    <label class="block mb-2">Phone Number</label>

                    <input type="tel"
                        placeholder="Enter phone number"
                        class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 focus:border-cyan-400 focus:outline-none">
                </div>

                <div>
                    <label class="block mb-2">Password</label>

                    <input type="password"
                        placeholder="Create password"
                        class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 focus:border-cyan-400 focus:outline-none">
                </div>

                <div>
                    <label class="block mb-2">Confirm Password</label>

                    <input type="password"
                        placeholder="Confirm password"
                        class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 focus:border-cyan-400 focus:outline-none">
                </div>

                <div>
                    <label class="flex items-center gap-2">
                        <input type="checkbox">
                        <span>I agree to the Terms & Conditions</span>
                    </label>
                </div>

                <button
                    type="submit"
                    class="w-full bg-cyan-500 hover:bg-cyan-600 py-4 rounded-xl font-semibold transition">
                    Create Account
                </button>

            </form>

            <div class="text-center mt-6">

                <p class="text-gray-300">
                    Already have an account?
                    <a href="login.html" class="text-cyan-400">
                        Login
                    </a>
                </p>

            </div>

            <div class="text-center mt-8">

                <a href="index.html"
                    class="inline-block border border-cyan-400 px-6 py-3 rounded-xl hover:bg-cyan-500 transition">
                    Back to Home
                </a>

            </div>

        </div>

    </div>

</body>

</html>
