<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - ParkEasy</title>

<link rel="icon" type="image/png" href="icons8-parking-50.png">

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
}

.glass{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.1);
}

</style>

</head>

<body class="min-h-screen flex items-center justify-center text-white">

<div class="grid md:grid-cols-2 w-11/12 max-w-6xl rounded-3xl overflow-hidden shadow-2xl">

    <!-- LEFT -->

    <div class="hidden md:flex flex-col justify-center p-12 bg-gradient-to-br from-cyan-600 to-blue-900">

        <h1 class="text-5xl font-bold mb-6">
            ParkEasy
        </h1>

        <p class="text-lg">
            Smart Parking Reservation Platform.
            Reserve parking slots instantly and manage bookings with ease.
        </p>

    </div>

    <!-- RIGHT -->

    <div class="glass p-10">

        <div class="text-center mb-8">

            <h2 class="text-4xl font-bold">
                Welcome Back
            </h2>

            <p class="text-gray-300 mt-3">
                Login to your ParkEasy account
            </p>

        </div>

        <form id="loginForm" class="space-y-5">

            <div>

                <label class="block mb-2">
                    Email Address
                </label>

                <input
                type="email"
                id="email"
                class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700"
                placeholder="Enter your email">
            </div>

            <div>

                <label class="block mb-2">
                    Password
                </label>

                <input
                type="password"
                id="password"
                class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700"
                placeholder="Enter your password">
            </div>

            <button
            
            type="submit"
            class="w-full bg-cyan-500 hover:bg-cyan-600 py-4 rounded-xl font-semibold">
                Login

            </button>

            <button
            type="button"
            id="google-login"
            class="w-full mt-4 bg-white text-black py-4 rounded-xl font-semibold">

                🔵 Sign in with Google

            </button>

        </form>

        <div class="text-center mt-6">

            <p class="text-gray-300">

                Don't have an account?

                <a href="register.html" class="text-cyan-400">
                    Register
                </a>

            </p>

        </div>

        <div class="text-center mt-8">

            <a href="index.html"
            class="inline-block border border-cyan-400 px-6 py-3 rounded-xl">

                Back to Home

            </a>

        </div>

    </div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {

    apiKey: "AIzaSyDlZ624_gsm3ZkpTnxzDwYaZaR8OFImimg",
    authDomain: "parkeasy-56150.firebaseapp.com",
    projectId: "parkeasy-56150",
    storageBucket: "parkeasy-56150.firebasestorage.app",
    messagingSenderId: "283894323899",
    appId: "1:283894323899:web:6809dda366fbac1e20a79e",
    measurementId: "G-4ZKGR51ZNW"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

provider.setCustomParameters({
    prompt: "select_account"
});

const googleBtn = document.getElementById("google-login");

googleBtn.addEventListener("click", async () => {

    googleBtn.disabled = true;
    googleBtn.innerText = "Signing in...";

    try{

        console.log("Starting Google Login...");

        const result = await signInWithPopup(auth,provider);

        const user = result.user;

        console.log(user);

        localStorage.setItem("username",user.displayName);
        localStorage.setItem("email",user.email);
        localStorage.setItem("photo",user.photoURL);

        alert("Welcome " + user.displayName);

        window.location.href="index.html";

    }

    catch(error){

        console.error(error);

        alert(
            "Error Code : " + error.code +
            "\n\n" +
            "Message : " + error.message
        );

    }

    finally{

        googleBtn.disabled = false;
        googleBtn.innerHTML = "🔵 Sign in with Google";

    }

});

</script>
<script src="js/script.js"></script>

</body>

</html>
